<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Global Freight Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  :root{
    --paper:#FBFAF7;
    --ink:#17150F;
    --ink-2:#615C4D;
    --ink-3:#938D7C;
    --line:#E8E3D6;
    --gold:#B8862B;
    --gold-deep:#8A6318;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--gold);text-decoration:none}
  a:hover{color:var(--gold-deep)}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

  .hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
    padding:0 clamp(24px,4vw,64px);overflow:hidden}

  nav{position:relative;z-index:4;display:flex;align-items:center;gap:48px;height:88px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;font-size:15px;letter-spacing:.24em;font-weight:500}
  .mark{width:10px;height:10px;background:var(--gold);transform:rotate(45deg)}
  .links{display:flex;gap:32px;margin-left:auto;font-size:13.5px;color:var(--ink-2)}
  .links a{color:inherit}
  .links a:hover{color:var(--ink)}
  .quote{border:1px solid var(--gold);color:var(--gold-deep);padding:9px 18px;border-radius:2px;
    white-space:nowrap;font-size:11.5px;letter-spacing:.14em;transition:.25s}
  .quote:hover{background:var(--gold);color:#fff}

  .stage{position:relative;flex:1;min-height:460px;margin:0 calc(-1 * clamp(24px,4vw,64px))}
  .stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* hub medallion */
  .hub{position:absolute;z-index:3;width:44px;height:44px;transform:translate(-50%,-50%) scale(.4);
    opacity:0;pointer-events:none}
  .hub.on{animation:hubIn .9s cubic-bezier(.2,.9,.3,1.1) forwards}
  @keyframes hubIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .hub .disc{position:absolute;inset:0;border-radius:50%;background:var(--paper);
    border:1.5px solid var(--gold);
    box-shadow:0 0 0 7px rgba(184,134,43,.10),0 0 34px 10px rgba(200,157,63,.22)}
  .hub .halo{position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(184,134,43,.5);
    animation:halo 3.6s cubic-bezier(.2,.6,.3,1) infinite}
  @keyframes halo{0%{transform:scale(1);opacity:.6}70%{opacity:0}100%{transform:scale(1.9);opacity:0}}

  .foot{position:absolute;left:clamp(24px,4vw,64px);bottom:clamp(18px,3.2vh,34px);z-index:4;
    display:flex;align-items:center;gap:12px;font-size:10.5px;letter-spacing:.22em;color:var(--ink-3)}
  .foot i{display:block;width:52px;height:1px;background:var(--line);position:relative;overflow:hidden}
  .foot i::after{content:"";position:absolute;inset:0;width:16px;background:var(--gold);animation:slide 2.8s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-18px)}55%{transform:translateX(52px)}100%{transform:translateX(52px)}}

  @media (prefers-reduced-motion:reduce){
    .hub.on{animation:none;opacity:1;transform:translate(-50%,-50%)}
    .hub .halo,.foot i::after{animation:none}
  }
  @media (max-width:820px){
    nav .links{display:none}
    .stage{min-height:380px}
    .hub{width:36px;height:36px}
  }
</style>
</head>
<body>
<div class="hero">
  <nav>
    <div class="brand"><span class="mark"></span>MERIDIAN</div>
    <div class="links">
      <a href="#">Network</a><a href="#">Ocean &amp; Air</a><a href="#">Customs</a><a href="#">Tracking</a>
    </div>
    <a href="#" class="quote mono">GET A QUOTE</a>
  </nav>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <svg id="sv" preserveAspectRatio="none"></svg>
    <div class="hub" id="hub" hidden></div>
  </div>

  <div class="foot mono"><i></i>SCROLL TO EXPLORE</div>
</div>

<script>
(function(){
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const sv = document.getElementById('sv'), hubEl = document.getElementById('hub');
  const NS = 'http://www.w3.org/2000/svg';

  const HOME = [78.9, 21.5];
  const REGIONS = [
    {k:'NORTH AMERICA', s:'USA, Canada, Mexico',        c:[-98,41],   dx:-2,  dy:104},
    {k:'EUROPE',        s:'UK, Germany, Netherlands',   c:[6,50],     dx:-16, dy:88},
    {k:'ASIA',          s:'China, Japan, South Korea',  c:[117,34],   dx:24,  dy:-58},
    {k:'SOUTH AMERICA', s:'Brazil, Chile',              c:[-57,-14],  dx:-6,  dy:96},
    {k:'AFRICA',        s:'South Africa, Kenya',        c:[24,-13],   dx:-6,  dy:100},
    {k:'AUSTRALIA',     s:'Australia',                  c:[134,-26],  dx:-48, dy:62},
    {k:'NEW ZEALAND',   s:'New Zealand',                c:[173,-41],  dx:14,  dy:60}
  ];

  const T_DOTS=1500, T_HUB=900, T_ARC0=1500, T_STAG=280, T_DRAW=1150, T_LEAD=380;
  const PULSE_EVERY=1000, PULSE_DUR=2100, GLOW=78, CELL=44;

  let world=null, india=null, proj=null, W=0, H=0, dots=[], cells=new Map(), base=null,
      t0=0, built=false, pulses=[], nextPulse=0, pulseIdx=0;
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const easeOut = t => 1-Math.pow(1-t,3);

  function build(){
    if(!world) return;
    const b = stage.getBoundingClientRect();
    W = Math.max(360, Math.round(b.width)); H = Math.max(300, Math.round(b.height));
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    sv.setAttribute('viewBox','0 0 '+W+' '+H);

    // whole world framed inside the stage (Antarctica dropped, as in the reference)
    proj = d3.geoNaturalEarth1().rotate([-22,0])
      .fitExtent([[W*0.035, H*0.055],[W*0.965, H*0.945]], world);

    // dot matrix sampled from real Natural Earth geometry; India sampled separately
    const off = document.createElement('canvas'); off.width=W; off.height=H;
    const octx = off.getContext('2d');
    octx.fillStyle='#000'; octx.beginPath(); d3.geoPath(proj,octx)(world); octx.fill();
    const land = octx.getImageData(0,0,W,H).data;
    const off2 = document.createElement('canvas'); off2.width=W; off2.height=H;
    const o2 = off2.getContext('2d');
    o2.fillStyle='#000'; o2.beginPath(); d3.geoPath(proj,o2)(india); o2.fill();
    const ind = o2.getImageData(0,0,W,H).data;

    const step = W>1200 ? 7 : 6;
    dots=[]; cells=new Map();
    const home = proj(HOME);
    for(let y=step; y<H-1; y+=step){
      for(let x=step; x<W-1; x+=step){
        const i = ((y|0)*W+(x|0))*4+3;
        if(land[i] > 96){
          const d={x:x,y:y,in:ind[i]>96, d:Math.hypot(x-home[0],y-home[1])};
          dots.push(d);
          const k=((x/CELL)|0)+':'+((y/CELL)|0);
          (cells.get(k) || cells.set(k,[]).get(k)).push(d);
        }
      }
    }
    dots.maxD = dots.reduce((a,d)=>Math.max(a,d.d),1);

    base = document.createElement('canvas'); base.width=W*dpr; base.height=H*dpr;
    const bc = base.getContext('2d'); bc.setTransform(dpr,0,0,dpr,0,0);
    const glow = bc.createRadialGradient(home[0],home[1],0,home[0],home[1],Math.max(90,W*0.085));
    glow.addColorStop(0,'rgba(201,158,63,.20)'); glow.addColorStop(1,'rgba(201,158,63,0)');
    bc.fillStyle=glow; bc.beginPath(); bc.arc(home[0],home[1],Math.max(90,W*0.085),0,6.2832); bc.fill();
    for(const d of dots){
      bc.fillStyle = d.in ? '#C79A3F' : '#DDD7C6';
      bc.beginPath(); bc.arc(d.x,d.y, d.in?1.65:1.25, 0, 6.2832); bc.fill();
    }

    hubEl.style.display = 'none';
    buildSvg(home);
    built = true;
    ctx.clearRect(0,0,W,H); ctx.drawImage(base,0,0,W,H);
  }

  function arcPath(a,b,trimA,trimB){
    // parabolic sweep, trimmed so the thread leaves the hub ring and stops at the node ring
    const p0 = proj(a), p1 = proj(b);
    const mx=(p0[0]+p1[0])/2, my=(p0[1]+p1[1])/2;
    const dx=p1[0]-p0[0], dy=p1[1]-p0[1], len=Math.hypot(dx,dy)||1;
    let nx=dy/len, ny=-dx/len;
    if(ny > 0){ nx=-nx; ny=-ny; }
    const k = Math.min(170, Math.max(40, len*0.22));
    const q = 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+
              'Q'+(mx+nx*k).toFixed(1)+' '+(my+ny*k).toFixed(1)+' '+p1[0].toFixed(1)+' '+p1[1].toFixed(1);
    const tmp = mk('path',{d:q}); sv.appendChild(tmp);
    const L = tmp.getTotalLength();
    const s0 = Math.min(trimA, L*0.26), s1 = Math.max(L-trimB, s0+2);
    let d='';
    for(let i=0;i<=64;i++){
      const p = tmp.getPointAtLength(s0+(s1-s0)*i/64);
      d += (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1);
    }
    sv.removeChild(tmp);
    return d;
  }
  const mk = (n,attrs) => { const e=document.createElementNS(NS,n);
    for(const k in attrs) e.setAttribute(k,attrs[k]); return e; };

  function buildSvg(home){
    while(sv.firstChild) sv.removeChild(sv.firstChild);
    const defs = mk('defs',{}); sv.appendChild(defs);
    const hubR = window.innerWidth>820 ? 30 : 25;
    REGIONS.forEach(function(r,i){
      const p = proj(r.c); r.p = p;
      const d = arcPath(HOME, r.c, hubR, 11);

      const g = mk('linearGradient',{id:'th'+i,gradientUnits:'userSpaceOnUse',
        x1:home[0],y1:home[1],x2:p[0],y2:p[1]});
      [['0%','#D9B978','0.3'],['28%','#C79A3F','1'],['100%','#A9781F','1']].forEach(function(s){
        g.appendChild(mk('stop',{offset:s[0],'stop-color':s[1],'stop-opacity':s[2]}));
      });
      defs.appendChild(g);

      const glow = mk('path',{d:d,fill:'none',stroke:'rgba(201,158,63,.13)','stroke-width':3.6,'stroke-linecap':'round'});
      glow.style.opacity = 0; sv.appendChild(glow); r.glow = glow;
      const arc = mk('path',{d:d,fill:'none',stroke:'url(#th'+i+')','stroke-width':1.15,'stroke-linecap':'round'});
      arc.style.opacity = 0; sv.appendChild(arc); r.arc = arc; r.len = arc.getTotalLength();

      const n = mk('g',{}); n.style.opacity = 0; sv.appendChild(n); r.node = n;
      n.appendChild(mk('circle',{cx:p[0],cy:p[1],r:10,fill:'none',stroke:'rgba(184,134,43,.28)','stroke-width':1}));
      n.appendChild(mk('circle',{cx:p[0],cy:p[1],r:4.2,fill:'#B8862B'}));
      const ring = mk('circle',{cx:p[0],cy:p[1],r:10,fill:'none',stroke:'#C79A3F','stroke-width':1});
      n.appendChild(ring); r.ring = ring;

      // leader + label, clamped inside the stage
      // leader + label, clamped inside the stage
      const lx = Math.max(14, Math.min(W-176, p[0]+r.dx)), ly = p[1]+r.dy;
      const lead = mk('path',{d:'M'+p[0]+' '+p[1]+'L'+p[0]+' '+(ly-(r.dy>0?30:-14))+'L'+(lx+2)+' '+(ly-(r.dy>0?30:-14)),
        fill:'none',stroke:'#CFC3A4','stroke-width':1,'stroke-dasharray':'2 3'});
      lead.style.opacity = 0; sv.appendChild(lead); r.lead = lead;

      const lab = mk('g',{}); lab.style.opacity = 0; sv.appendChild(lab); r.lab = lab;
      const t1 = mk('text',{x:lx,y:ly,fill:'#17150F','font-size':11,'letter-spacing':2.1,
        'font-family':'IBM Plex Mono, monospace','font-weight':500});
      t1.textContent = r.k; lab.appendChild(t1);
      const t2 = mk('text',{x:lx,y:ly+16,fill:'#938D7C','font-size':11.5,
        'font-family':'Helvetica Neue, Helvetica, Arial, sans-serif'});
      t2.textContent = r.s; lab.appendChild(t2);
    });
    // travelling pulse dot
    pulses = [];
  }

  function frame(ts){
    if(!t0) t0 = ts;
    const t = REDUCED ? 99999 : ts - t0;
    if(built){
      ctx.clearRect(0,0,W,H);
      ctx.drawImage(base,0,0,W,H);

      // dots bloom outward from India
      if(t < T_DOTS){
        const p = easeOut(t/T_DOTS), rad = p*dots.maxD*1.15, home = proj(HOME);
        ctx.globalCompositeOperation='destination-in';
        const g = ctx.createRadialGradient(home[0],home[1],Math.max(0,rad-90),home[0],home[1],rad);
        g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        ctx.globalCompositeOperation='source-over';
      }
      if(t > T_HUB && !hubEl.classList.contains('on')) hubEl.classList.add('on');

      REGIONS.forEach(function(r,i){
        const st = t - (T_ARC0 + i*T_STAG);
        if(st < 0) return;
        const dp = Math.min(1, st/T_DRAW), dq = easeOut(dp);
        r.arc.style.opacity = 0.95; r.glow.style.opacity = 1;
        r.arc.setAttribute('stroke-dasharray', r.len);
        r.arc.setAttribute('stroke-dashoffset', (r.len*(1-dq)).toFixed(1));
        r.glow.setAttribute('stroke-dasharray', r.len);
        r.glow.setAttribute('stroke-dashoffset', (r.len*(1-dq)).toFixed(1));
        if(dp < 1){
          const pt = r.arc.getPointAtLength(dq*r.len);
          bloom(pt.x, pt.y, 1);
          return;
        }
        const after = st - T_DRAW;
        r.node.style.opacity = Math.min(1, after/240);
        const rp = ((after % 3600)/3600);
        r.ring.setAttribute('r', (10 + rp*9).toFixed(1));
        r.ring.style.opacity = (0.55*(1-rp)).toFixed(2);
        r.lead.style.opacity = Math.min(1, Math.max(0,(after-160)/T_LEAD));
        r.lab.style.opacity  = Math.min(1, Math.max(0,(after-320)/420));
      });

      // ambient shipment pulses along the established lanes
      const settled = T_ARC0 + REGIONS.length*T_STAG + T_DRAW + 500;
      if(!REDUCED && t > settled){
        if(t > nextPulse){
          nextPulse = t + PULSE_EVERY;
          pulses.push({i:pulseIdx % REGIONS.length, t0:t});
          pulseIdx++;
        }
        for(let n=pulses.length-1;n>=0;n--){
          const pu = pulses[n], k = (t-pu.t0)/PULSE_DUR;
          if(k >= 1){ pulses.splice(n,1); continue; }
          const r = REGIONS[pu.i], pt = r.arc.getPointAtLength(easeOut(k)*r.len);
          const fade = k < .12 ? k/.12 : (k > .88 ? (1-k)/.12 : 1);
          bloom(pt.x, pt.y, fade);
        }
      }
    }
    requestAnimationFrame(frame);
  }

  function bloom(x,y,a){
    const rg = ctx.createRadialGradient(x,y,0,x,y,GLOW);
    rg.addColorStop(0,'rgba(200,157,63,'+(0.20*a).toFixed(3)+')'); rg.addColorStop(1,'rgba(200,157,63,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,GLOW,0,6.2832); ctx.fill();
    const cx=(x/CELL)|0, cy=(y/CELL)|0;
    for(let ox=-2;ox<=2;ox++) for(let oy=-2;oy<=2;oy++){
      const arr = cells.get((cx+ox)+':'+(cy+oy)); if(!arr) continue;
      for(const d of arr){
        const dist = Math.hypot(d.x-x, d.y-y); if(dist>GLOW) continue;
        const k = (1 - dist/GLOW)*a;
        ctx.fillStyle = 'rgba(184,134,43,'+(0.22+0.7*k).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(d.x,d.y,1.3+1.5*k*k,0,6.2832); ctx.fill();
      }
    }
    ctx.fillStyle='#FBFAF7'; ctx.beginPath(); ctx.arc(x,y,3.4,0,6.2832); ctx.fill();
    ctx.strokeStyle='#B8862B'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(x,y,3.4,0,6.2832); ctx.stroke();
  }

  let rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){
    t0 = 0; nextPulse = 0; build();
  }, 220); });

  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
    .then(r => r.json())
    .then(function(topo){
      world = topojson.feature(topo, topo.objects.countries);
      world.features = world.features.filter(f => String(f.id) !== '010');
      india = world.features.filter(f => String(f.id) === '356')[0] || world.features[0];
      build();
      requestAnimationFrame(frame);
    })
    .catch(function(){ stage.style.display='none'; });
})();
</script>
</body>
</html>
